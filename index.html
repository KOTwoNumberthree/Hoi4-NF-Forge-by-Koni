    const opt1 = el("input",{type:"checkbox", checked:true}); const opt2 = el("input",{type:"checkbox", checked:true}); const opt3 = el("input",{type:"checkbox", checked:true});
    body.appendChild(el("label",{style:"display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;"},[opt1, `focus_tree コード（common/national_focus/${ft().id}.txt）`]));
    body.appendChild(el("label",{style:"display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;"},[opt2, "Localisation（全言語、localisation/&lt;lang&gt;/*.yml）"]));
    body.appendChild(el("label",{style:"display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;"},[opt3, "プロジェクトファイル（.json、再編集用）"]));
    body.appendChild(el("p",{style:"font-size:11px;color:var(--ink-faint);margin-top:10px;line-height:1.6;"},
      "複数ファイルは .zip にまとめてダウンロードされます（.yml はそのままではダウンロードを許可されない形式のため、zip内に格納します）。"));
    return { onSave: async ()=>{
      close();
      await exportBundle({ code:opt1.checked, loc:opt2.checked, proj:opt3.checked });
    }};
  });
}
async function exportBundle(opts){
  if(typeof JSZip === "undefined"){ alert("エクスポート機能の読み込みに失敗しました。ネットワーク設定をご確認ください。"); return; }
  const zip = new JSZip();
  const treeId = ft().id || "focus_tree";
  if(opts.code){
    zip.file(`common/national_focus/${treeId}.txt`, "\uFEFF" + generateFocusTreeCode(state.project));
  }
  if(opts.loc){
    const all = generateLocalisationCodeAll(state.project);
    for(const langCode in all){
      zip.file(`localisation/${pdxLangKey(langCode)}/${treeId}_l_${pdxLangKey(langCode)}.yml`, "\uFEFF" + all[langCode]);
    }
  }
  if(opts.proj){
    zip.file(`${treeId}.project.json`, JSON.stringify(state.project, null, 2));
  }
  const blob = await zip.generateAsync({ type:"blob" });
  offerDownload(treeId + "_export.zip", blob);
  setStatus("エクスポートを開始しました。");
}

/* -------- downloads capability wrapper -------- */
let downloadsNS = null;
async function initDownloads(){
  try{ downloadsNS = await claude.use("downloads"); }catch(e){ downloadsNS = null; }
}
async function offerDownload(filename, data){
  if(downloadsNS){
    try{
      await downloadsNS.save({ filename, data: typeof data==="string" ? data : data });
      setStatus(`${filename} を保存しました。`);
      return;
    }catch(err){
      if(err && err.code === "declined") return;
      // fall through to manual fallback
    }
  }
  // fallback: in-browser blob download (used outside the claude.ai viewer)
  try{
    const blob = typeof data === "string" ? new Blob([data], {type:"text/plain;charset=utf-8"}) : data;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
    setStatus(`${filename} をダウンロードしました。`);
  }catch(e){ alert("ダウンロードできませんでした: " + e.message); }
}

/* =========================================================================
   15. Status bar
   ========================================================================= */
let statusTimer = null;
function setStatus(msg){
  const s = document.getElementById("statusmsg");
  if(s) s.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=>{ if(s) s.textContent = "準備完了"; }, 4000);
}
function renderStatusbar(){
  const bar = document.getElementById("statusbar");
  clear(bar);
  const issues = currentIssues;
  const errCount = issues.filter(i=>i.severity==="error").length;
  const warnCount = issues.filter(i=>i.severity==="warn").length;
  bar.appendChild(el("span",{id:"statusmsg"}, "準備完了"));
  bar.appendChild(el("span",{class:"stat"},[ el("span",{class:"dot", style:"background:var(--teal)"}), `NF ${ft().focuses.length}` ]));
  bar.appendChild(el("span",{class:"stat"},[ el("span",{class:"dot", style:"background:var(--brass)"}), `ブランチ ${ft().branches.length}` ]));
  bar.appendChild(el("span",{class:"stat"},[ el("span",{class:"dot", style:`background:${errCount?"var(--red-bright)":"var(--line)"}`}), `エラー ${errCount}` ]));
  bar.appendChild(el("span",{class:"stat"},[ el("span",{class:"dot", style:`background:${warnCount?"var(--brass)":"var(--line)"}`}), `警告 ${warnCount}` ]));
  const cov = locCoverage(state.ui.codeLang);
  bar.appendChild(el("span",{class:"stat"}, `Localization対応: ${cov.named} / ${cov.total} NF`));
  bar.appendChild(el("span",{class:"stat"}, `選択中: ${state.selection.size}`));
  bar.appendChild(el("span",{class:"stat", style:"margin-left:auto;"}, "自動保存: 有効"));
}

/* =========================================================================
   16. Master render + autosave + init
   ========================================================================= */
function onProjectChanged(label, skipHistoryPush){
  renderAll();
  scheduleAutosave();
}
function renderAll(){
  renderToolbar();
  renderSidebar();
  renderCanvas();
  renderCanvasTransform();
  renderModebar();
  renderCanvasHud();
  renderProperties();
  renderBottom();
  renderStatusbar();
}
function renderModebar(){
  const bar = document.getElementById("modebar");
  clear(bar);
  const langSel = el("select", {class:"pill", style:"padding:5px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);"});
  state.project.localisation.languages.forEach(l=> langSel.appendChild(el("option",{value:l.code, selected:l.code===state.ui.codeLang}, "プレビュー言語: "+l.label)));
  langSel.addEventListener("change", ()=>{ state.ui.codeLang = langSel.value; renderCanvas(); renderProperties(); renderBottom(); });
  bar.appendChild(langSel);
  if(state.ui.activeBranchFilter){
    const b = branchById(state.ui.activeBranchFilter);
    if(b) bar.appendChild(el("span",{class:"pill on"}, [ "表示中: "+b.name, el("span",{style:"cursor:pointer;margin-left:4px;", onclick:()=>{ state.ui.activeBranchFilter=null; renderAll(); }},"✕") ]));
  }
  if(state.ui.previewMode) bar.appendChild(el("span",{class:"pill on"}, "▶ プレビューモード"));
}
function renderCanvasHud(){
  const hud = document.getElementById("canvashud");
  clear(hud);
  hud.appendChild(el("div",{class:"hud-btn", title:"ズームイン", onclick:()=>{ zoomBy(1.2); }}, "＋"));
  hud.appendChild(el("div",{class:"hud-btn", title:"ズームアウト", onclick:()=>{ zoomBy(1/1.2); }}, "－"));
  hud.appendChild(el("div",{class:"hud-btn", title:"全体表示", onclick: fitToScreen}, "⤢"));
}
function zoomBy(factor){
  const wrap = document.getElementById("canvaswrap");
  const cx = wrap.clientWidth/2, cy = wrap.clientHeight/2;
  const before = screenToWorld(cx,cy);
  state.camera.zoom = clamp(state.camera.zoom*factor, 0.12, 2.5);
  const after = screenToWorld(cx,cy);
  state.camera.x += (after.x-before.x)*state.camera.zoom;
  state.camera.y += (after.y-before.y)*state.camera.zoom;
  renderCanvasTransform();
}

const AUTOSAVE_KEY = "focusforge_autosave_v1";
const scheduleAutosave = debounce(()=>{
  try{
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ project: state.project, savedAt: Date.now() }));
    const s = document.getElementById("statusmsg");
    if(s && s.textContent === "準備完了") { /* keep quiet on routine saves */ }
  }catch(e){ /* storage unavailable — ignore silently, in-memory state still holds */ }
}, 900);

function tryLoadAutosave(){
  try{
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.project && parsed.project.focusTree) return parsed;
  }catch(e){}
  return null;
}

function init(){
  initDownloads();
  const saved = tryLoadAutosave();
  if(saved){
    state.project = Object.assign(makeEmptyProject(), saved.project);
  } else {
    state.project = seedProject();
  }
  sanitizeCoordinates(state.project.focusTree);
  if(!state.ui.codeLang || !state.project.localisation.languages.some(l=>l.code===state.ui.codeLang)){
    state.ui.codeLang = (state.project.localisation.languages[0]||{}).code || "japanese";
  }
  setupCanvasPanZoom();
  setupKeyboardShortcuts();
  window.addEventListener("resize", ()=> renderCanvasTransform());
  renderAll();
  fitToScreen();
  state.ready = true;
}
document.addEventListener("DOMContentLoaded", init);
