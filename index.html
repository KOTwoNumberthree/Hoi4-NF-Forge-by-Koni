<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Forge — HOI4 National Focus Tree Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#11151b;
  --bg-alt:#161b22;
  --panel:#1a212b;
  --panel-2:#1f2733;
  --line:#2a3341;
  --line-soft:#232b37;
  --ink:#d9dee6;
  --ink-dim:#8993a3;
  --ink-faint:#5c6675;
  --brass:#c9973b;
  --brass-dim:#8a6a2e;
  --brass-bright:#e6b95c;
  --teal:#5f9c85;
  --red:#c1543f;
  --red-bright:#e2694f;
  --blue:#5c86b0;
  --radius:3px;
  --font-head:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eceef1; --bg-alt:#e4e7eb; --panel:#f4f5f7; --panel-2:#eceef1;
    --line:#c7cdd6; --line-soft:#d7dbe1; --ink:#232a33; --ink-dim:#5b6472; --ink-faint:#8891a0;
  }
}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  height:100%;
  overflow:hidden;
  font-size:13px;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; color:inherit; }
::selection{ background:var(--brass); color:#1a1408; }

/* ---------- App Shell ---------- */
#app{
  display:grid;
  grid-template-rows:44px 1fr 220px 24px;
  height:100%;
  min-height:0;
}
#toolbar{
  grid-row:1;
  display:flex;
  align-items:center;
  gap:2px;
  padding:0 8px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
  height:calc(44px + env(safe-area-inset-top,0px));
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
}
#brand{
  font-family:var(--font-head);
  font-weight:600;
  font-size:15px;
  letter-spacing:.02em;
  color:var(--brass-bright);
  padding:0 14px 0 4px;
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}
#brand .sub{ font-family:var(--font-body); font-size:10px; color:var(--ink-faint); font-weight:500; }
.tb-sep{ width:1px; align-self:stretch; margin:8px 6px; background:var(--line); flex:0 0 auto; }
.tb-btn{
  background:transparent; border:1px solid transparent; border-radius:var(--radius);
  color:var(--ink-dim); padding:6px 9px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px;
  flex:0 0 auto;
}
.tb-btn:hover{ background:var(--panel-2); color:var(--ink); border-color:var(--line); }
.tb-btn:active{ transform:translateY(1px); }
.tb-btn.primary{ color:var(--brass-bright); }
.tb-btn.primary:hover{ background:rgba(201,151,59,.14); border-color:var(--brass-dim); }
.tb-btn:disabled{ opacity:.35; cursor:default; }
.tb-btn:disabled:hover{ background:transparent; border-color:transparent; }
#zoomreadout{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); min-width:42px; text-align:center; }
.tb-spacer{ flex:1 1 auto; }
#projname{
  background:transparent;border:1px solid transparent;color:var(--ink);font-family:var(--font-head);
  font-size:13px;padding:5px 8px;border-radius:var(--radius);min-width:120px;max-width:260px;
}
#projname:hover, #projname:focus{ border-color:var(--line); background:var(--panel-2); outline:none; }

/* ---------- Middle: sidebar / canvas / properties ---------- */
#mid{ grid-row:2; display:grid; grid-template-columns:250px 1fr 300px; min-height:0; }
#sidebar, #propspanel{ background:var(--panel); border-right:1px solid var(--line); min-height:0; display:flex; flex-direction:column; }
#propspanel{ border-right:none; border-left:1px solid var(--line); }

.tabs{ display:flex; border-bottom:1px solid var(--line); flex:0 0 auto; }
.tab{ flex:1; padding:8px 4px; text-align:center; font-family:var(--font-head); font-size:11px; letter-spacing:.04em;
  color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; background:var(--bg-alt); }
.tab.active{ color:var(--brass-bright); border-color:var(--brass); background:var(--panel); }
.tab:hover:not(.active){ color:var(--ink-dim); }
.tabpage{ flex:1; min-height:0; overflow-y:auto; display:none; }
.tabpage.active{ display:flex; flex-direction:column; }

.side-section{ border-bottom:1px solid var(--line-soft); padding:10px; }
.side-section h4{ margin:0 0 8px; font-family:var(--font-head); font-size:10.5px; letter-spacing:.08em; color:var(--ink-faint); font-weight:500; }
.branch-row{ display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:var(--radius); cursor:pointer; }
.branch-row:hover{ background:var(--panel-2); }
.branch-row.active{ background:var(--panel-2); outline:1px solid var(--line); }
.branch-swatch{ width:9px; height:9px; border-radius:2px; flex:0 0 auto; }
.branch-row .bn{ flex:1; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.branch-row .cnt{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); }
.branch-row .eye{ opacity:.5; cursor:pointer; font-size:11px; }
.branch-row .eye:hover{ opacity:1; }
.mini-btn{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim); border-radius:var(--radius); padding:4px 7px; font-size:11px; cursor:pointer; }
.mini-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }
.full-btn{ width:100%; text-align:left; }

#searchbox{ width:100%; background:var(--bg-alt); border:1px solid var(--line); border-radius:var(--radius); padding:7px 8px; color:var(--ink); font-size:12px; }
#searchbox:focus{ outline:none; border-color:var(--brass-dim); }
.search-result{ padding:7px 10px; border-bottom:1px solid var(--line-soft); cursor:pointer; }
.search-result:hover{ background:var(--panel-2); }
.search-result .sid{ font-family:var(--font-mono); font-size:10.5px; color:var(--brass-bright); }
.search-result .sname{ font-size:12px; color:var(--ink); margin-top:1px; }
.search-result .sctx{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; }
.search-hint{ padding:14px 10px; color:var(--ink-faint); font-size:11.5px; line-height:1.6; }

.asset-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:6px; padding:10px; }
.asset-tile{ border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-alt); cursor:pointer; padding:4px; text-align:center; }
.asset-tile:hover{ border-color:var(--brass-dim); }
.asset-tile.sel{ border-color:var(--brass); background:rgba(201,151,59,.1); }
.asset-tile img{ width:100%; height:32px; object-fit:contain; display:block; margin-bottom:3px; image-rendering:pixelated; }
.asset-tile .an{ font-size:8.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- Canvas ---------- */
#canvaswrap{ position:relative; overflow:hidden; background:
   radial-gradient(circle at 1px 1px, var(--line-soft) 1px, transparent 1px) 0 0/26px 26px, var(--bg);
  cursor:grab; }
#canvaswrap.panning{ cursor:grabbing; }
#canvaswrap.connect-mode{ cursor:crosshair; }
#world{ position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
#connlayer{ position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }
#nodelayer{ position:absolute; top:0; left:0; }

.fnode{
  position:absolute; width:128px; min-height:78px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line); border-radius:5px;
  padding:7px 8px 8px; cursor:grab; user-select:none;
  box-shadow:0 1px 0 rgba(0,0,0,.3);
}
.fnode:hover{ border-color:var(--ink-faint); }
.fnode.sel{ border-color:var(--brass); box-shadow:0 0 0 2px rgba(201,151,59,.28); }
.fnode.dragging{ cursor:grabbing; opacity:.88; z-index:50; }
.fnode.err{ border-color:var(--red); }
.fnode.warn{ border-left:3px solid var(--brass); }
.fnode .fn-top{ display:flex; align-items:center; gap:6px; }
.fnode .fn-icon{ width:26px; height:26px; border-radius:3px; background:var(--bg-alt); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto; overflow:hidden; }
.fnode .fn-icon img{ width:100%; height:100%; object-fit:contain; }
.fnode .fn-icon .ph{ font-size:11px; color:var(--ink-faint); }
.fnode .fn-branchdot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; margin-left:auto; }
.fnode .fn-title{ font-size:11.5px; font-weight:600; line-height:1.25; margin-top:6px; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.fnode .fn-id{ font-family:var(--font-mono); font-size:8.5px; color:var(--ink-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fnode .fn-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
.fnode .fn-cost{ font-family:var(--font-mono); font-size:10px; color:var(--brass-bright); }
.fnode .fn-badges{ display:flex; gap:3px; }
.fnode .badge{ width:6px; height:6px; border-radius:50%; }
.fnode .badge.b-err{ background:var(--red-bright); }
.fnode .badge.b-warn{ background:var(--brass); }
.fnode .badge.b-mutex{ background:transparent; border:1px solid var(--red-bright); }
.fnode .badge.b-code{ background:var(--blue); }
.fnode .conn-handle{ position:absolute; width:14px; height:14px; border-radius:50%; background:var(--brass); border:2px solid var(--bg);
  left:50%; transform:translateX(-50%); display:none; cursor:crosshair; }
.fnode .conn-handle.top{ top:-7px; } .fnode .conn-handle.bottom{ bottom:-7px; }
.fnode:hover .conn-handle, .fnode.sel .conn-handle{ display:block; }

#canvashud{ position:absolute; left:10px; bottom:10px; display:flex; gap:6px; z-index:5; }
#canvashud .hud-btn{ width:26px; height:26px; border-radius:var(--radius); background:var(--panel); border:1px solid var(--line);
  color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; }
#canvashud .hud-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }
#modebar{ position:absolute; top:10px; left:10px; z-index:5; display:flex; gap:6px; align-items:center; }
.pill{ background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:5px 11px; font-size:11px; color:var(--ink-dim); display:flex; align-items:center; gap:6px;}
.pill.on{ border-color:var(--brass-dim); color:var(--brass-bright); background:rgba(201,151,59,.1); }
#emptyhint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; text-align:center; color:var(--ink-faint); font-size:12.5px; line-height:2; }

/* marquee */
#marquee{ position:absolute; border:1px solid var(--brass); background:rgba(201,151,59,.12); pointer-events:none; display:none; }

/* ---------- Properties panel ---------- */
.prop-empty{ padding:30px 16px; text-align:center; color:var(--ink-faint); font-size:12px; line-height:1.9; }
.prop-scroll{ flex:1; overflow-y:auto; }
.prop-group{ border-bottom:1px solid var(--line-soft); padding:11px 12px; }
.prop-group h4{ margin:0 0 9px; font-family:var(--font-head); font-size:10.5px; letter-spacing:.08em; color:var(--ink-faint); font-weight:500; display:flex; align-items:center; justify-content:space-between; }
.field{ margin-bottom:8px; }
.field label{ display:block; font-size:10.5px; color:var(--ink-faint); margin-bottom:3px; }
.field input[type=text], .field input[type=number], .field select, .field textarea{
  width:100%; background:var(--bg-alt); border:1px solid var(--line); border-radius:var(--radius);
  padding:6px 7px; color:var(--ink); font-size:12px;
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--brass-dim); }
.field textarea{ font-family:var(--font-mono); font-size:11px; resize:vertical; min-height:52px; line-height:1.5; }
.field-row{ display:flex; gap:6px; }
.field-row .field{ flex:1; }
.icon-picker-btn{ display:flex; align-items:center; gap:8px; background:var(--bg-alt); border:1px solid var(--line); border-radius:var(--radius); padding:6px 7px; cursor:pointer; }
.icon-picker-btn:hover{ border-color:var(--brass-dim); }
.icon-picker-btn .ip-prev{ width:24px; height:24px; background:var(--panel-2); border-radius:2px; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto; }
.icon-picker-btn .ip-prev img{ width:100%; height:100%; object-fit:contain; }
.icon-picker-btn .ip-name{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip-list{ display:flex; flex-wrap:wrap; gap:5px; }
.chip{ display:flex; align-items:center; gap:5px; background:var(--bg-alt); border:1px solid var(--line); border-radius:20px; padding:3px 4px 3px 9px; font-size:11px; font-family:var(--font-mono); }
.chip .x{ cursor:pointer; color:var(--ink-faint); width:14px; height:14px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.chip .x:hover{ background:var(--red); color:#fff; }
.chip.mx{ border-color:rgba(193,84,63,.5); }
.prereq-group{ background:var(--bg-alt); border:1px solid var(--line); border-radius:var(--radius); padding:6px; margin-bottom:6px; }
.prereq-group .pg-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
.prereq-group .pg-head span{ font-size:10px; color:var(--ink-faint); }
.add-row{ display:flex; gap:5px; margin-top:6px; }
.add-row select{ flex:1; }
.status-list{ display:flex; flex-direction:column; gap:4px; }
.status-item{ display:flex; gap:6px; align-items:flex-start; font-size:11px; padding:5px 6px; border-radius:var(--radius); background:var(--bg-alt); }
.status-item.err{ border-left:2px solid var(--red-bright); }
.status-item.warn{ border-left:2px solid var(--brass); }
.status-item.ok{ border-left:2px solid var(--teal); }
.lang-block{ border:1px solid var(--line); border-radius:var(--radius); padding:8px; margin-bottom:8px; }
.lang-block .lb-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.lang-block .lb-head b{ font-size:11.5px; color:var(--brass-bright); font-family:var(--font-head); font-weight:500; letter-spacing:.03em; }

/* ---------- Bottom panel ---------- */
#bottom{ grid-row:3; background:var(--panel); border-top:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
#bottomtabs{ display:flex; align-items:center; border-bottom:1px solid var(--line); flex:0 0 auto; }
.btab{ padding:7px 14px; font-family:var(--font-head); font-size:11px; letter-spacing:.05em; color:var(--ink-faint); cursor:pointer; border-right:1px solid var(--line-soft); display:flex; align-items:center; gap:6px; }
.btab.active{ color:var(--brass-bright); background:var(--bg-alt); }
.btab .cnt{ background:var(--line); color:var(--ink-dim); font-family:var(--font-mono); font-size:9.5px; padding:1px 5px; border-radius:8px; }
.btab .cnt.err{ background:var(--red); color:#fff; }
#bottomtools{ margin-left:auto; display:flex; gap:6px; padding-right:8px; }
#bottompages{ flex:1; min-height:0; }
.bpage{ height:100%; display:none; }
.bpage.active{ display:flex; }
#codeout, #localeout{ flex:1; margin:0; padding:10px 14px; font-family:var(--font-mono); font-size:11.5px; line-height:1.6; color:var(--ink);
  white-space:pre; overflow:auto; background:var(--bg-alt); border:none; resize:none; width:100%; tab-size:4; }
#codeout:focus, #localeout:focus{ outline:none; }
.code-side{ width:190px; border-left:1px solid var(--line); background:var(--panel); padding:10px; overflow-y:auto; flex:0 0 auto; }
.code-side h5{ margin:0 0 6px; font-size:10px; color:var(--ink-faint); letter-spacing:.06em; font-family:var(--font-head); font-weight:500; }
.code-side .desc{ font-size:11px; color:var(--ink-faint); line-height:1.6; margin-bottom:10px; }
.errpage{ flex:1; overflow-y:auto; padding:8px; }
.err-row{ display:flex; gap:8px; padding:6px 8px; border-bottom:1px solid var(--line-soft); cursor:pointer; align-items:flex-start; }
.err-row:hover{ background:var(--panel-2); }
.err-row .sev{ width:7px; height:7px; border-radius:50%; margin-top:4px; flex:0 0 auto; }
.err-row .sev.error{ background:var(--red-bright); }
.err-row .sev.warn{ background:var(--brass); }
.err-row .em{ font-size:12px; }
.err-row .ef{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:2px; }
.err-empty{ padding:24px; text-align:center; color:var(--teal); font-size:12px; }

/* ---------- Status bar ---------- */
#statusbar{ grid-row:4; display:flex; align-items:center; gap:14px; padding:0 12px; background:var(--bg-alt); border-top:1px solid var(--line);
  font-size:10.5px; color:var(--ink-faint); padding-bottom:env(safe-area-inset-bottom,0px); }
#statusbar .stat{ display:flex; align-items:center; gap:5px; }
#statusmsg{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot{ width:6px;height:6px;border-radius:50%; }

/* ---------- Modal ---------- */
#modalbg{ position:fixed; inset:0; background:rgba(8,10,14,.6); display:none; align-items:center; justify-content:center; z-index:100; }
#modalbg.show{ display:flex; }
.modal{ background:var(--panel); border:1px solid var(--line); border-radius:6px; width:520px; max-width:92vw; max-height:82vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.5); }
.modal .mh{ padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
.modal .mh h3{ margin:0; font-family:var(--font-head); font-size:14px; font-weight:500; letter-spacing:.02em; }
.modal .mh .close{ cursor:pointer; color:var(--ink-faint); font-size:16px; }
.modal .mb{ padding:16px; overflow-y:auto; }
.modal .mf{ padding:12px 16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
.btn{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink); border-radius:var(--radius); padding:7px 14px; font-size:12px; cursor:pointer; }
.btn:hover{ border-color:var(--ink-faint); }
.btn.primary{ background:var(--brass-dim); border-color:var(--brass-dim); color:#1a1408; font-weight:600; }
.btn.primary:hover{ background:var(--brass); }
.btn.danger{ border-color:var(--red); color:var(--red-bright); }
.btn.danger:hover{ background:rgba(193,84,63,.12); }
#iconsearch{ width:100%; margin-bottom:10px; }
.iconmodal-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:8px; }
.context-menu{ position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 8px 30px rgba(0,0,0,.5); z-index:200; padding:4px; min-width:170px; }
.cm-item{ padding:7px 10px; font-size:12px; cursor:pointer; border-radius:2px; display:flex; justify-content:space-between; }
.cm-item:hover{ background:var(--panel-2); }
.cm-item.danger{ color:var(--red-bright); }
.cm-sep{ height:1px; background:var(--line); margin:4px 2px; }

::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:var(--ink-faint); }

.hidden{ display:none !important; }
@media (max-width: 900px){
  #mid{ grid-template-columns:0 1fr 0; }
  #sidebar, #propspanel{ position:fixed; top:44px; bottom:244px; width:80vw; max-width:300px; z-index:40; transform:translateX(-100%); transition:transform .15s; }
  #propspanel{ left:auto; right:0; transform:translateX(100%); }
  #sidebar.open{ transform:translateX(0); }
  #propspanel.open{ transform:translateX(0); }
  #bottom{ height:180px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar"></div>
  <div id="mid">
    <div id="sidebar"></div>
    <div id="canvaswrap">
      <div id="world">
        <svg id="connlayer" width="1" height="1"><defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--ink-faint)"></path></marker>
        </defs></svg>
        <div id="nodelayer"></div>
      </div>
      <div id="marquee"></div>
      <div id="modebar"></div>
      <div id="emptyhint"></div>
      <div id="canvashud"></div>
    </div>
    <div id="propspanel"></div>
  </div>
  <div id="bottom">
    <div id="bottomtabs"></div>

/* =========================================================================
   0. Small utilities
   ========================================================================= */
function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "style") e.style.cssText = attrs[k];
    else if(k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else if(k === "html") e.innerHTML = attrs[k];
    else if(attrs[k] === true) e.setAttribute(k, "");
    else if(attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  if(children) for(const c of [].concat(children)){
    if(c == null) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}
// SVG elements MUST be created in the SVG namespace (createElementNS), not with
// document.createElement — an <svg><path> built via createElement is just an
// inert, invisible HTML element once attached to the SVG tree. This is the
// dedicated constructor for every element that lives inside #connlayer.
const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, children){
  const e = document.createElementNS(SVG_NS, tag);
  if(attrs) for(const k in attrs){
    if(k === "class") e.setAttribute("class", attrs[k]);
    else if(k === "style") e.style.cssText = attrs[k];
    else if(k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] === true) e.setAttribute(k, "");
    else if(attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  if(children) for(const c of [].concat(children)){
    if(c == null) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function uid(prefix){ return (prefix||"id") + "_" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function escHtml(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,a), ms); }; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function toSafeId(s){
  s = (s||"").toUpperCase().trim().replace(/[^A-Z0-9_]+/g, "_").replace(/^_+|_+$/g, "");
  if(!/^[A-Z_]/.test(s)) s = "F_" + s;

function ft(){ return state.project.focusTree; }
function loc(){ return state.project.localisation; }
function focusById(id){ return ft().focuses.find(f => f.id === id); }

/* -------- History (snapshot based) -------- */
const HISTORY_LIMIT = 100;
function snapshot(){ return JSON.stringify(state.project); }
function pushHistory(){
  if(!state.project) return;
  state.history.undo.push(snapshot());
  if(state.history.undo.length > HISTORY_LIMIT) state.history.undo.shift();
  state.history.redo.length = 0;
}
function commit(label, mutator){
  pushHistory();

  onProjectChanged(label);
}
function undo(){
  if(!state.history.undo.length) return;
  state.history.redo.push(snapshot());
  const s = state.history.undo.pop();
  state.project = JSON.parse(s);
  sanitizeSelection();
  onProjectChanged("undo", true);
}
function redo(){
  if(!state.history.redo.length) return;
  state.history.undo.push(snapshot());
  const s = state.history.redo.pop();
  state.project = JSON.parse(s);
  sanitizeSelection();
  onProjectChanged("redo", true);
}
function sanitizeSelection(){
  const ids = new Set(ft().focuses.map(f=>f.id));
  for(const id of Array.from(state.selection)) if(!ids.has(id)) state.selection.delete(id);
  if(state.activeFocusId && !ids.has(state.activeFocusId)) state.activeFocusId = [...state.selection][0] || null;
}

/* =========================================================================
   3. HOI4 code generator
   ========================================================================= */
function q(s){ return '"' + String(s==null?"":s).replace(/"/g,'\\"') + '"'; }
function indentBlock(code, spaces){
  const pad = " ".repeat(spaces);
  return String(code||"").split("\n").map(l => l.trim()===""? "" : pad+l).join("\n");
}
function mutexPartnersOf(focusId){
  return mutexPartnersIn(ft(), focusId);
}
function mutexPartnersIn(tree, focusId){
  const set = new Set();
  for(const g of tree.mutexGroups){
    if(g.focuses.includes(focusId)) for(const o of g.focuses) if(o!==focusId) set.add(o);
  }
  return [...set];
}
function generateFocusCode(f, tree){
  const L = [];
  L.push("    focus = {");
  L.push(`        id = ${f.id}`);
  L.push(`        icon = ${f.icon || "GFX_goal_generic_national_focus"}`);
  if(f.relativePositionId){
    L.push(`        x = ${f.x}`);
    L.push(`        y = ${f.y}`);
    L.push(`        relative_position_id = ${f.relativePositionId}`);
  } else {
    L.push(`        x = ${f.x}`);
    L.push(`        y = ${f.y}`);
  }
  L.push(`        cost = ${f.cost}`);
  for(const group of f.prerequisites){
    if(!group.length) continue;
    L.push("        prerequisite = { " + group.map(id=>`focus = ${id}`).join(" ") + " }");
  }
  const partners = mutexPartnersIn(tree, f.id);
  if(partners.length){
    L.push("        mutually_exclusive = { " + partners.map(id=>`focus = ${id}`).join(" ") + " }");
  }
  if(f.availableCode.trim()){
    L.push("        available = {");
    L.push(indentBlock(f.availableCode, 12));
    L.push("        }");
  }
  if(f.bypassCode.trim()){
    L.push("        bypass = {");
    L.push(indentBlock(f.bypassCode, 12));
    L.push("        }");
  }
  if(f.cancelCode.trim()){
    L.push("        cancel = {");
    L.push(indentBlock(f.cancelCode, 12));
    L.push("        }");
  }
  if(f.searchFiltersCode.trim()){
    L.push("        search_filters = { " + f.searchFiltersCode.trim() + " }");
  }
  L.push("        completion_reward = {");
  if(f.completionRewardCode.trim()) L.push(indentBlock(f.completionRewardCode, 12));
  L.push("        }");
  if(f.aiWillDoCode.trim()){
    L.push("        ai_will_do = {");
    L.push(indentBlock(f.aiWillDoCode, 12));
    L.push("        }");
  }
  if(f.willLeadToWarWithCode.trim()){
    L.push("        will_lead_to_war_with = { " + f.willLeadToWarWithCode.trim() + " }");
  }
  for(const ex of (f.extraFields||[])){
    if(ex.isBlock){
      L.push(`        ${ex.key} = {`);
      L.push(indentBlock(ex.raw, 12));
      L.push("        }");
    } else {
      L.push(`        ${ex.key} = ${ex.raw}`);
    }
  }
  L.push("    }");
  return L.join("\n");
}
function generateFocusTreeCode(project){
  const tree = project.focusTree;
  const L = [];
  L.push("focus_tree = {");
  L.push(`    id = ${tree.id}`);
  if(tree.country && tree.country.trim()){
    L.push("    country = {");
    L.push(`        factor = 1`);
    L.push("        modifier = {");
    L.push(`            add = 10`);
    L.push(`            tag = ${tree.country.trim()}`);
    L.push("        }");
    L.push("    }");
  }
  if(tree.default) L.push("    default = no");
  if(tree.resetOnCivilwar === false) L.push("    reset_on_civilwar = no");
  if(tree.extraCode && tree.extraCode.trim()){
    L.push(indentBlock(tree.extraCode, 4));
  }
  L.push("");
  for(const f of tree.focuses){
    L.push(generateFocusCode(f, tree));
    L.push("");
  }
  L.push("}");
  return L.join("\n").replace(/\n{3,}/g, "\n\n");
}
function generateLocalisationCode(project, langCode){
  const L = [];
  L.push(`l_${langCode === "english" ? "english" : (project.localisation.languages.find(l=>l.code===langCode)||{}).pdxKey || langCode}:`);

function pdxLangKey(code){
  const known = { japanese:"japanese", english:"english", german:"german", french:"french", spanish:"spanish",
    russian:"russian", polish:"polish", braz_por:"braz_por", simp_chinese:"simp_chinese" };
  return known[code] || code;
}
function generateLocalisationCodeAll(project){
  const out = {};
  for(const lang of project.localisation.languages){

    for(const f of project.focusTree.focuses){

/* =========================================================================
   4. HOI4 script parser (generic brace-matching tokenizer)
   Preserves unknown fields verbatim so future Effects/Triggers survive.
   ========================================================================= */
function splitEntries(text){
  const entries = [];
  let i = 0; const n = text.length;
  function skipWs(){
    while(i < n){
      const c = text[i];
      if(c === "#"){ while(i<n && text[i] !== "\n") i++; continue; }
      if(/\s/.test(c)){ i++; continue; }
      break;
    }
  }
  while(i < n){
    skipWs();
    if(i >= n) break;
    const keyStart = i;
    while(i < n && !/[\s={}]/.test(text[i])) i++;
    let key = text.slice(keyStart, i);
    if(!key){ i++; continue; }
    skipWs();
    if(text[i] !== "="){
      // bare token (e.g. inside a plain list) — record as bare value
      entries.push({ key: null, raw: key, isBlock:false, bare:true });
      continue;
    }
    i++; // consume '='
    skipWs();
    if(text[i] === "{"){
      let depth = 1, j = i+1, start = j, inStr = false;
      while(j < n && depth > 0){
        const c = text[j];
        if(c === '"'){ inStr = !inStr; j++; continue; }
        if(!inStr){
          if(c === "#"){ while(j<n && text[j] !== "\n") j++; continue; }
          if(c === "{"){ depth++; }
          else if(c === "}"){ depth--; if(depth===0){ break; } }
        }
        j++;
      }
      const raw = text.slice(start, j);
      entries.push({ key, raw, isBlock:true });
      i = j+1;
    } else if(text[i] === '"'){
      let j = i+1;
      while(j<n && text[j] !== '"') j++;
      entries.push({ key, raw: text.slice(i+1, j), isBlock:false, quoted:true });
      i = j+1;
    } else {
      let start = i;
      while(i<n && !/[\s{}]/.test(text[i])) i++;
      entries.push({ key, raw: text.slice(start, i), isBlock:false });
    }
  }
  return entries;
}

const KNOWN_FOCUS_FREE_FIELDS = {
  available:"availableCode", bypass:"bypassCode", cancel:"cancelCode",
  completion_reward:"completionRewardCode", ai_will_do:"aiWillDoCode",
};
const KNOWN_FOCUS_STRUCT_FIELDS = new Set([
  "id","icon","x","y","cost","relative_position_id","prerequisite","mutually_exclusive",
  "available","bypass","cancel","completion_reward","ai_will_do","will_lead_to_war_with","search_filters",
]);

function parseFocusEntry(raw, warnings, lineHint){
  const entries = splitEntries(raw);
  const f = makeFocus({});
  f.mutexIdsLocal = []; // temp holder resolved later into mutexGroups
  for(const e of entries){
    if(!e.key) continue;
    switch(e.key){
      case "id": f.id = e.raw.trim(); break;
      case "icon": f.icon = e.raw.trim(); break;
      case "x": f.x = Math.round(parseFloat(e.raw) || 0); break;
      case "y": f.y = Math.round(parseFloat(e.raw) || 0); break;
      case "cost": f.cost = parseFloat(e.raw) || 0; break;
      case "relative_position_id": f.relativePositionId = e.raw.trim(); break;
      case "prerequisite": {
        const inner = splitEntries(e.raw);
        const group = inner.filter(x=>x.key==="focus").map(x=>x.raw.trim());
        if(group.length) f.prerequisites.push(group);
        break;
      }
      case "mutually_exclusive": {
        const inner = splitEntries(e.raw);
        const ids = inner.filter(x=>x.key==="focus").map(x=>x.raw.trim());
        f.mutexIdsLocal.push(...ids);
        break;
      }
      case "search_filters": f.searchFiltersCode = e.raw.trim(); break;
      case "will_lead_to_war_with": f.willLeadToWarWithCode = e.raw.trim(); break;
      case "available": f.availableCode = e.raw.trim(); break;
      case "bypass": f.bypassCode = e.raw.trim(); break;
      case "cancel": f.cancelCode = e.raw.trim(); break;
      case "completion_reward": f.completionRewardCode = e.raw.trim(); break;
      case "ai_will_do": f.aiWillDoCode = e.raw.trim(); break;
      default:
        f.extraFields.push({ key: e.key, raw: e.raw, isBlock: e.isBlock });
    }
  }
  if(!f.id){
    f.id = uid("IMPORTED").toUpperCase();
    warnings.push({ line: lineHint||"?", target:"(unnamed focus)", reason:"id フィールドが見つからないため自動生成しました: " + f.id });
  }
  return f;
}

function parseFocusTreeText(text){
  const warnings = [];
  const top = splitEntries(text);
  const treeEntry = top.find(e => e.key === "focus_tree" && e.isBlock);
  if(!treeEntry){
    return { ok:false, error: "focus_tree = { ... } ブロックが見つかりませんでした。", warnings };
  }
  const body = splitEntries(treeEntry.raw);
  const tree = { id:"imported_focus_tree", country:"", default:true, resetOnCivilwar:true, extraCode:"", focuses:[], branches:[], mutexGroups:[] };
  const extraLines = [];
  const focusEntries = [];
  for(const e of body){
    if(!e.key) continue;
    if(e.key === "id" && !e.isBlock){ tree.id = e.raw.trim(); continue; }
    if(e.key === "focus" && e.isBlock){ focusEntries.push(e); continue; }
    if(e.key === "default" && !e.isBlock){ tree.default = e.raw.trim() !== "no"; continue; }
    if(e.key === "reset_on_civilwar" && !e.isBlock){ tree.resetOnCivilwar = e.raw.trim() !== "no"; continue; }
    // preserve anything else (country=, continuous_focus_position=, joint_focus=, etc.) as free extra code
    if(e.isBlock) extraLines.push(`${e.key} = {\n${indentBlock(e.raw,4)}\n}`);
    else extraLines.push(`${e.key} = ${e.quoted ? q(e.raw) : e.raw}`);
  }
  tree.extraCode = extraLines.join("\n");

  const idSeen = new Set();
  for(const fe of focusEntries){
    const f = parseFocusEntry(fe.raw, warnings);
    if(idSeen.has(f.id)){
      const newId = f.id + "_" + uid("dup").slice(-4);
      warnings.push({ line:"?", target:f.id, reason:`ID が重複していたため ${newId} に変更しました。` });
      f.id = newId;
    }
    idSeen.add(f.id);
    tree.focuses.push(f);
  }
  // resolve mutual exclusivity into groups (union-find-ish via simple merge)
  const groups = [];
  function findGroup(id){ return groups.find(g => g.focuses.includes(id)); }
  for(const f of tree.focuses){
    for(const otherId of f.mutexIdsLocal){
      let g1 = findGroup(f.id), g2 = findGroup(otherId);
      if(g1 && g2 && g1 !== g2){
        g1.focuses = [...new Set([...g1.focuses, ...g2.focuses])];
        groups.splice(groups.indexOf(g2),1);
      } else if(g1){ if(!g1.focuses.includes(otherId)) g1.focuses.push(otherId); }
      else if(g2){ if(!g2.focuses.includes(f.id)) g2.focuses.push(f.id); }
      else groups.push({ id: uid("mutex"), focuses:[f.id, otherId] });
    }
    delete f.mutexIdsLocal;
  }
  tree.mutexGroups = groups;

  // validate prerequisite / mutex references exist; warn but keep them (don't silently drop)
  const idSet = new Set(tree.focuses.map(f=>f.id));
  for(const f of tree.focuses){
    for(const grp of f.prerequisites) for(const rid of grp){
      if(!idSet.has(rid)) warnings.push({ line:"?", target:f.id, reason:`前提条件 "${rid}" が存在するNFの中に見つかりません（そのまま保持します）。` });
    }
  }

  // auto-assign a single default branch if none exists, and place unresolved x/y
  if(tree.focuses.length){
    const branch = { id: uid("branch"), name:"インポート", color: BRANCH_COLORS[0], collapsed:false, hidden:false, description:"" };
    tree.branches.push(branch);
    for(const f of tree.focuses) f.branchId = branch.id;
  }
  return { ok:true, tree, warnings };
}

function parseLocalisationText(text, forceLangKey){
  // Real HOI4 .yml localisation format:
  //   l_japanese:
  //    NF_example:0 "国家再建"
  //    NF_example_desc:0 "国家の再建を開始する。"
  // A file may (rarely) contain more than one l_<lang>: block; each is parsed
  // as its own language *unless* forceLangKey is supplied by the user, in
  // which case every key/value line in the file — regardless of which (or
  // whether any) l_<lang>: header precedes it — is filed under that single,
  // user-chosen language. This lets the user's explicit language choice take
  // priority over whatever the file itself declares (or doesn't declare).
  const lines = text.split(/\r?\n/);
  let autoLangKey = null;
  const result = {};
  for(const raw of lines){
    const line = raw.replace(/^\uFEFF/, "");
    if(/^\s*#/.test(line)) continue;      // comment line
    if(/^\s*$/.test(line)) continue;      // blank line
    const m = line.match(/^\s*l_([a-zA-Z_]+)\s*:\s*$/);
    if(m){ autoLangKey = m[1]; continue; }
    const langKey = forceLangKey || autoLangKey;
    if(!langKey) continue; // no language context yet (no header seen, no override given) — skip safely
    const em = line.match(/^\s*([A-Za-z0-9_.]+)\s*:\s*\d*\s*"((?:[^"\\]|\\.)*)"/);
    if(em){
      const key = em[1];
      const val = em[2].replace(/\\n/g, "\n").replace(/\\"/g, '"');
      if(!result[langKey]) result[langKey] = {};
      const bucket = result[langKey];
      if(key.endsWith("_desc")){
        const base = key.slice(0, -5);
        bucket[base] = bucket[base] || {};
        bucket[base].desc = val;
      } else {
        bucket[key] = bucket[key] || {};
        bucket[key].name = val;
      }
    }
  }
  return result;
}

/* -------- language <-> pdx key bookkeeping -------- */
const LANG_LABELS = {
  japanese:"日本語", english:"English", german:"Deutsch", french:"Français", spanish:"Español",
  russian:"Русский", polish:"Polski", braz_por:"Português (Brasil)", simp_chinese:"简体中文",
  korean:"한국어", italian:"Italiano", turkish:"Türkçe",
};
function labelForLangKey(key){ return LANG_LABELS[key] || (key.charAt(0).toUpperCase()+key.slice(1)); }
function ensureLanguage(langKey){
  let lang = state.project.localisation.languages.find(l=>l.code===langKey);
  if(!lang){
    lang = { code: langKey, label: labelForLangKey(langKey) };
    state.project.localisation.languages.push(lang);
  }
  return lang;
}
// merges parsed .yml content (see parseLocalisationText) into the project.
// Later-loaded files overwrite matching keys — same rule as HOI4 itself uses across loc files.
function mergeLocalisationImport(parsedByLang){
  const stats = { languages:{}, unmatchedKeys:0, matchedFocusKeys:0 };
  const idSet = new Set(ft().focuses.map(f=>f.id));
  for(const langKey in parsedByLang){
    ensureLanguage(langKey);
    const bucket = parsedByLang[langKey];
    let matched = 0, unmatched = 0;
    for(const key in bucket){
      const entry = bucket[key];
      if(!state.project.localisation.entries[key]) state.project.localisation.entries[key] = {};
      const existing = state.project.localisation.entries[key][langKey] || {};
      state.project.localisation.entries[key][langKey] = {
        name: entry.name != null ? entry.name : existing.name,
        desc: entry.desc != null ? entry.desc : existing.desc,
      };
      if(idSet.has(key)) matched++; else unmatched++;
    }
    stats.languages[langKey] = { keys: Object.keys(bucket).length, matched, unmatched };
    stats.matchedFocusKeys += matched;
    stats.unmatchedKeys += unmatched;
  }
  return stats;
}
// Coverage summary for a given language: how many NFs currently have a
// non-empty display name (and separately, description) for that language,
// out of the total NF count. Used by the "Localization対応: X / Y NF" readout.
function locCoverage(langCode){
  const focuses = ft().focuses;
  let named = 0, desced = 0;
  for(const f of focuses){
    const e = (state.project.localisation.entries[f.id] || {})[langCode];
    if(e && e.name && e.name.trim()) named++;
    if(e && e.desc && e.desc.trim()) desced++;
  }
  return { total: focuses.length, named, desced };
}

/* =========================================================================
   5. Validator
   ========================================================================= */
function validateProject(project){
  const issues = []; // {severity:'error'|'warn', focusId, message}
  const tree = project.focusTree;
  const idCount = {};
  for(const f of tree.focuses) idCount[f.id] = (idCount[f.id]||0)+1;
  const idSet = new Set(tree.focuses.map(f=>f.id));

  if(!tree.id || !/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(tree.id)){
    issues.push({ severity:"error", focusId:null, message:`focus_tree の id "${tree.id}" が不正です（英数字とアンダースコアのみ使用可能）。` });
  }
  if(!tree.focuses.length){
    issues.push({ severity:"warn", focusId:null, message:"NFが1つも作成されていません。" });
  }

  for(const f of tree.focuses){
    if(!f.id || !/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(f.id)){
      issues.push({ severity:"error", focusId:f.id, message:`NF ID "${f.id}" が不正です（英数字とアンダースコアのみ）。` });
    }
    if(idCount[f.id] > 1){
      issues.push({ severity:"error", focusId:f.id, message:`NF ID "${f.id}" が重複しています。` });
    }
    if(!f.icon || !f.icon.trim()){
      issues.push({ severity:"warn", focusId:f.id, message:"アイコンが未設定です。" });
    }
    if(f.cost == null || isNaN(f.cost) || f.cost < 0){
      issues.push({ severity:"error", focusId:f.id, message:`Cost の値が不正です: ${f.cost}` });
    }
    if(!Number.isFinite(f.x) || !Number.isFinite(f.y)){
      issues.push({ severity:"error", focusId:f.id, message:"座標(x, y) が数値ではありません。" });
    }
    for(const grp of f.prerequisites) for(const rid of grp){
      if(!idSet.has(rid)) issues.push({ severity:"error", focusId:f.id, message:`前提条件の参照先 "${rid}" が存在しません。` });
    }
    if(f.relativePositionId && !idSet.has(f.relativePositionId)){
      issues.push({ severity:"error", focusId:f.id, message:`relative_position_id の参照先 "${f.relativePositionId}" が存在しません。` });
    }
    const partners = mutexPartnersInProject(project, f.id);
    for(const pid of partners){
      if(!idSet.has(pid)) issues.push({ severity:"error", focusId:f.id, message:`相互排他の参照先 "${pid}" が存在しません。` });
    }
    const hasLoc = project.localisation.entries[f.id];
    const primary = project.localisation.languages[0] && hasLoc && hasLoc[project.localisation.languages[0].code];
    if(!primary || !primary.name || !primary.name.trim()){
      issues.push({ severity:"warn", focusId:f.id, message:"表示名（Localisation）が未設定です。" });
    }
    if(!f.completionRewardCode.trim()){
      issues.push({ severity:"warn", focusId:f.id, message:"completion_reward が空です（HOI4的には有効ですが、報酬なしのNFになります）。" });
    }
  }
  // detect prerequisite cycles
  const cyc = detectCycles(tree.focuses);
  for(const id of cyc) issues.push({ severity:"error", focusId:id, message:"前提条件の循環参照が検出されました。" });
  return issues;
}
function mutexPartnersInProject(project, focusId){
  const set = new Set();
  for(const g of project.focusTree.mutexGroups) if(g.focuses.includes(focusId)) for(const o of g.focuses) if(o!==focusId) set.add(o);
  return [...set];
}
function detectCycles(focuses){
  const graph = {}; for(const f of focuses) graph[f.id] = f.prerequisites.flat();
  const bad = new Set();
  const WHITE=0, GRAY=1, BLACK=2; const color = {}; for(const id in graph) color[id]=WHITE;
  function dfs(id, stack){
    color[id]=GRAY; stack.push(id);
    for(const dep of (graph[id]||[])){
      if(!(dep in color)) continue;
      if(color[dep]===GRAY){ for(const s of stack) bad.add(s); bad.add(dep); }
      else if(color[dep]===WHITE) dfs(dep, stack);
    }
    stack.pop(); color[id]=BLACK;
  }
  for(const id in graph) if(color[id]===WHITE) dfs(id, []);
  return [...bad];
}
function focusIssues(issuesList, focusId){ return issuesList.filter(i=>i.focusId===focusId); }

/* =========================================================================
   6. Layout: absolute position resolution (handles relative_position_id) +
      auto-layout (layered, based on prerequisite depth)
   ========================================================================= */
function resolveAbsolutePositions(tree){
  const pos = {}; // id -> {x,y} in grid units
  const visiting = new Set();
  function resolve(f){
    if(pos[f.id]) return pos[f.id];
    if(visiting.has(f.id)){ pos[f.id] = { x:f.x, y:f.y }; return pos[f.id]; }
    visiting.add(f.id);
    let base = { x:0, y:0 };
    if(f.relativePositionId){
      const rf = focusByIdIn(tree, f.relativePositionId);
      if(rf && rf !== f) base = resolve(rf);
    }
    const p = { x: base.x + f.x, y: base.y + f.y };
    pos[f.id] = p;
    visiting.delete(f.id);
    return p;
  }
  for(const f of tree.focuses) resolve(f);
  return pos;
}
function focusByIdIn(tree, id){ return tree.focuses.find(f=>f.id===id); }

function autoLayout(){
  const tree = ft();
  if(!tree.focuses.length) return;
  resolvedXCache = {};
  const byId = {}; tree.focuses.forEach(f=>byId[f.id]=f);
  const depth = {};
  const preds = {}; tree.focuses.forEach(f=> preds[f.id] = f.prerequisites.flat().filter(id=>byId[id]));
  function getDepth(id, seen){
    if(depth[id] != null) return depth[id];
    if(seen.has(id)) return 0;
    seen.add(id);
    const ps = preds[id];
    const d = ps.length ? 1 + Math.max(...ps.map(p=>getDepth(p, seen))) : 0;
    depth[id] = d;
    return d;
  }
  tree.focuses.forEach(f => getDepth(f.id, new Set()));

  // group by branch, then within branch lay out by depth (y) and assign x via sibling ordering
  const byBranch = {};
  for(const f of tree.focuses){ (byBranch[f.branchId||""] = byBranch[f.branchId||""] || []).push(f); }
  let branchOriginX = 0;
  const order = tree.branches.map(b=>b.id).concat([""]);
  for(const bid of order){
    const list = byBranch[bid]; if(!list || !list.length) continue;
    const rows = {};
    for(const f of list){ (rows[depth[f.id]] = rows[depth[f.id]] || []).push(f); }
    let maxWidth = 0;
    const depths = Object.keys(rows).map(Number).sort((a,b)=>a-b);
    for(const d of depths){
      const row = rows[d];
      row.sort((a,b)=> (preds[a.id][0]&&byId[preds[a.id][0]] ? (resolvedXCache[preds[a.id][0]]||0) : 0) - (preds[b.id][0]&&byId[preds[b.id][0]] ? (resolvedXCache[preds[b.id][0]]||0) : 0));
      row.forEach((f,i)=>{
        f.x = Math.round(branchOriginX + i - (row.length-1)/2);
        f.y = d;
        f.relativePositionId = "";
        resolvedXCache[f.id] = f.x;
      });
      maxWidth = Math.max(maxWidth, row.length);
    }
    branchOriginX += Math.max(maxWidth, 2) + 1;
  }
}
let resolvedXCache = {};

/* =========================================================================
   7. ID / reference integrity helpers
   ========================================================================= */
function renameFocusId(oldId, newId){
  newId = toSafeId(newId);
  if(newId === oldId) return newId;
  if(focusById(newId)){ return null; } // collision — caller should warn
  const tree = ft();
  const f = focusById(oldId); if(!f) return null;
  f.id = newId;
  for(const other of tree.focuses){
    other.prerequisites = other.prerequisites.map(grp => grp.map(id => id===oldId? newId : id));
    if(other.relativePositionId === oldId) other.relativePositionId = newId;
  }
  for(const g of tree.mutexGroups) g.focuses = g.focuses.map(id => id===oldId? newId : id);
  if(state.project.localisation.entries[oldId]){
    state.project.localisation.entries[newId] = state.project.localisation.entries[oldId];
    delete state.project.localisation.entries[oldId];
  }
  if(state.activeFocusId === oldId) state.activeFocusId = newId;
  if(state.selection.has(oldId)){ state.selection.delete(oldId); state.selection.add(newId); }
  return newId;
}
function removeFocus(id){
  const tree = ft();
  tree.focuses = tree.focuses.filter(f=>f.id!==id);
  for(const f of tree.focuses) f.prerequisites = f.prerequisites.map(g=>g.filter(x=>x!==id)).filter(g=>g.length);
  for(const g of tree.mutexGroups) g.focuses = g.focuses.filter(x=>x!==id);
  tree.mutexGroups = tree.mutexGroups.filter(g=>g.focuses.length>1);
  for(const f of tree.focuses) if(f.relativePositionId===id) f.relativePositionId = "";
  delete state.project.localisation.entries[id];
  state.selection.delete(id);
  if(state.activeFocusId===id) state.activeFocusId = null;
}
function uniqueFocusId(base){
  base = toSafeId(base || "NEW_FOCUS");
  let id = base, n = 1;
  while(focusById(id)) id = base + "_" + (++n);
  return id;
}
// HOI4 focus x/y are grid slots and must be whole numbers. Any legacy/imported
// fractional coordinates are rounded (round-half-up) so the *stored* data — not
// just the on-screen position — is always an integer.
function sanitizeCoordinates(tree){
  for(const f of tree.focuses){
    f.x = Math.round(Number(f.x) || 0);
    f.y = Math.round(Number(f.y) || 0);
  }
}
// HOI4 treats `cost` as an abstract point value; the actual number of days to
// complete a focus is cost × 7 (i.e. one "cost point" per game week).
function costToDays(cost){ return Math.round((Number(cost)||0) * 7); }

/* ---- toolbar actions ---- */
function addFocusAtCenter(){
  const tree = ft();
  const wrap = document.getElementById("canvaswrap");
  const cx = wrap.clientWidth/2, cy = wrap.clientHeight/2;
  const world = screenToWorld(cx, cy);
  const gx = Math.round(world.x / state.project.settings.gridX);
  const gy = Math.round(world.y / state.project.settings.gridY);
  commit("add focus", ()=>{
    const branchId = state.ui.activeBranchFilter || (tree.branches[0] && tree.branches[0].id) || ensureDefaultBranch();
    const f = makeFocus({ id: uniqueFocusId("NEW_FOCUS"), x:gx, y:gy, branchId });
    tree.focuses.push(f);
    state.selection = new Set([f.id]);
    state.activeFocusId = f.id;
  });
}
function ensureDefaultBranch(){
  const tree = ft();
  if(tree.branches.length) return tree.branches[0].id;
  const b = { id: uid("branch"), name:"未分類", color: BRANCH_COLORS[0], collapsed:false, hidden:false, description:"" };
  tree.branches.push(b);
  return b.id;
}
function duplicateSelection(){
  if(!state.selection.size) return;
  commit("duplicate", ()=>{
    const ids = [...state.selection];
    const idMap = {};
    const tree = ft();
    const clones = [];
    for(const id of ids){
      const src = focusById(id); if(!src) continue;
      const clone = deepClone(src);
      clone.id = uniqueFocusId(src.id + "_COPY");
      clone.x = src.x; clone.y = src.y + 0; // placed then offset below
      idMap[id] = clone.id;
      clones.push(clone);
    }
    for(const c of clones){
      c.x += 1; c.y += 1;
      c.prerequisites = c.prerequisites.map(g => g.map(pid => idMap[pid] || pid));
      if(c.relativePositionId && idMap[c.relativePositionId]) c.relativePositionId = idMap[c.relativePositionId];
      tree.focuses.push(c);
      const srcLoc = state.project.localisation.entries[ids[clones.indexOf(c)]];
      if(srcLoc) state.project.localisation.entries[c.id] = deepClone(srcLoc);
    }
    // duplicate mutex relationships among the selected set only
    for(const g of tree.mutexGroups.slice()){
      const relevant = g.focuses.filter(id => idMap[id]);
      if(relevant.length > 1){
        tree.mutexGroups.push({ id: uid("mutex"), focuses: relevant.map(id=>idMap[id]) });
      }
    }
    state.selection = new Set(clones.map(c=>c.id));
    state.activeFocusId = clones[0] && clones[0].id;
  });
}
function deleteSelection(){
  if(!state.selection.size) return;
  const ids = [...state.selection];
  commit("delete", ()=>{ for(const id of ids) removeFocus(id); });
}
function fitToScreen(){
  const tree = ft();
  if(!tree.focuses.length){ state.camera = {x:80,y:40,zoom:1}; renderCanvasTransform(); return; }
  const pos = resolveAbsolutePositions(tree);
  const gx = state.project.settings.gridX, gy = state.project.settings.gridY;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const f of tree.focuses){
    const p = pos[f.id];
    minX = Math.min(minX, p.x*gx); maxX = Math.max(maxX, p.x*gx+128);
    minY = Math.min(minY, p.y*gy); maxY = Math.max(maxY, p.y*gy+90);
  }
  const wrap = document.getElementById("canvaswrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const zoom = clamp(Math.min(w/(maxX-minX+160), h/(maxY-minY+160), 1.4), 0.15, 1.4);
  state.camera.zoom = zoom;
  state.camera.x = w/2 - ((minX+maxX)/2)*zoom;
  state.camera.y = h/2 - ((minY+maxY)/2)*zoom;
  renderCanvasTransform();
}

/* =========================================================================
   10. Rendering — Canvas (nodes + connections)
   ========================================================================= */
function screenToWorld(sx, sy){
  return { x: (sx - state.camera.x) / state.camera.zoom, y: (sy - state.camera.y) / state.camera.zoom };
}
function renderCanvasTransform(){

let currentIssues = [];
function renderCanvas(){

    else if(hasWarn) badges.appendChild(el("span",{class:"badge b-warn", title:"警告あり"}));
    if(mutexPartnersOf(f.id).length) badges.appendChild(el("span",{class:"badge b-mutex", title:"相互排他あり"}));
    if(f.completionRewardCode.trim() || f.availableCode.trim() || f.bypassCode.trim()) badges.appendChild(el("span",{class:"badge b-code", title:"手動コードあり"}));
    bottom.appendChild(badges);

/* -------- orthogonal (H/V-only) connector routing -------- */
const NODE_HALF_W = 64, NODE_TOP_Y = 0, NODE_BOTTOM_Y = 79;
// Anchors always run from the node that sits higher on screen (smaller grid Y)
// to the one that sits lower, exiting the upper node's bottom edge and
// entering the lower node's top edge. If the "from" focus happens to be
// below its "to" focus (unusual, but must not crash), the anchor sides are
// swapped so the line still reads sensibly instead of running backwards.
function orthogonalAnchors(fromPos, toPos, gx, gy){
  const fx = fromPos.x*gx + NODE_HALF_W, tx = toPos.x*gx + NODE_HALF_W;
  if(fromPos.y <= toPos.y){
    return { ax: fx, ay: fromPos.y*gy + NODE_BOTTOM_Y, bx: tx, by: toPos.y*gy + NODE_TOP_Y };
  }
  return { ax: fx, ay: fromPos.y*gy + NODE_TOP_Y, bx: tx, by: toPos.y*gy + NODE_BOTTOM_Y };
}
// Builds a horizontal/vertical-only path: down from A to the vertical
// midpoint, across to B's column, then down into B. Falls back to a single
// straight segment when A and B already share a column or a row, so no
// pointless jog is drawn. Never produces a diagonal segment.
function orthogonalPath(ax, ay, bx, by){
  if(Math.abs(ax-bx) < 0.5 || Math.abs(ay-by) < 0.5) return `M ${ax} ${ay} L ${bx} ${by}`;
  const midY = (ay+by)/2;
  return `M ${ax} ${ay} L ${ax} ${midY} L ${bx} ${midY} L ${bx} ${by}`;
}
function renderConnections(visible, pos, gx, gy){
  const svg = document.getElementById("connlayer");
  clear(svg);
  const defs = svgEl("defs");
  const marker = svgEl("marker", { id:"arrow", markerWidth:"9", markerHeight:"9", refX:"7", refY:"3.5", orient:"auto" },
    [ svgEl("path", { d:"M0,0 L7,3.5 L0,7 Z", fill:"#eef1f5" }) ]);
  defs.appendChild(marker);
  svg.appendChild(defs);
  const visibleIds = new Set(visible.map(f=>f.id));
  let maxX=0, maxY=0;
  // prerequisite connections — white line, H/V-only, A(prereq) above -> B(this focus) below
  for(const f of visible){
    const p = pos[f.id]; maxX = Math.max(maxX, p.x*gx+300); maxY = Math.max(maxY, p.y*gy+300);
    if(!f.prerequisites.length) continue;
    f.prerequisites.forEach((group)=>{
      group.forEach(fromId=>{
        if(!visibleIds.has(fromId)) return;
        const fp = pos[fromId]; if(!fp) return;
        const { ax, ay, bx, by } = orthogonalAnchors(fp, p, gx, gy);
        const strokeDash = group.length>1 ? "5,3" : "none"; // dashed = one of several OR-alternative prerequisites
        svg.appendChild(svgEl("path", { d: orthogonalPath(ax,ay,bx,by), stroke:"#eef1f5", "stroke-width":"1.6", fill:"none",
          "stroke-dasharray": strokeDash, "marker-end":"url(#arrow)", opacity:"0.85" }));
      });
    });
  }
  // mutually-exclusive connections — red line, same H/V-only routing, no arrowhead (relation is symmetric)
  const drawnPairs = new Set();
  for(const g of ft().mutexGroups){
    for(let i=0;i<g.focuses.length;i++) for(let j=i+1;j<g.focuses.length;j++){
      const a = g.focuses[i], b = g.focuses[j];
      if(!visibleIds.has(a) || !visibleIds.has(b)) continue;
      const key = [a,b].sort().join("|"); if(drawnPairs.has(key)) continue; drawnPairs.add(key);
      const pa = pos[a], pb = pos[b];
      const { ax, ay, bx, by } = orthogonalAnchors(pa, pb, gx, gy);
      svg.appendChild(svgEl("path", { d: orthogonalPath(ax,ay,bx,by), stroke:"#e2694f", "stroke-width":"1.6",
        "stroke-dasharray":"4,3", fill:"none", opacity:"0.8" }));
    }
  }
  svg.setAttribute("width", Math.max(maxX,1));
  svg.setAttribute("height", Math.max(maxY,1));
}

/* -------- connect-drag (create prerequisite by dragging from a handle) -------- */
function startConnectDrag(focusId, dir, ev){
  state.ui.connectMode = true;
  state.ui.connectFrom = { focusId, dir };
  const wrap = document.getElementById("canvaswrap");
  wrap.classList.add("connect-mode");
  function move(e){ renderGhostLine(focusId, dir, e); }
  function up(e){
    wrap.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const targetNode = target && target.closest(".fnode");
    removeGhostLine();
    state.ui.connectMode = false; wrap.classList.remove("connect-mode");
    if(targetNode){
      const targetId = targetNode.getAttribute("data-id");
      if(targetId && targetId !== focusId){
        const fromId = dir === "out" ? focusId : targetId;
        const toId = dir === "out" ? targetId : focusId;
        commit("connect focus", ()=>{
          const toF = focusById(toId);
          if(toF && !toF.prerequisites.some(g=>g.includes(fromId))) toF.prerequisites.push([fromId]);
        });
        return;
      }
    }
    renderAll();
  }
  wrap.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
}
function renderGhostLine(focusId, dir, e){
  let ghost = document.getElementById("ghostline");
  const svg = document.getElementById("connlayer");
  if(!ghost){ ghost = svgEl("path", {id:"ghostline", stroke:"#e6b95c", "stroke-width":"1.8", fill:"none", "stroke-dasharray":"4,3"}); svg.appendChild(ghost); }
  const tree = ft(); const pos = resolveAbsolutePositions(tree);
  const gx = state.project.settings.gridX, gy = state.project.settings.gridY;
  const f = focusById(focusId); const p = pos[focusId];
  const fromX = p.x*gx+64, fromY = dir==="out" ? p.y*gy+79 : p.y*gy;
  const wrap = document.getElementById("canvaswrap");
  const rect = wrap.getBoundingClientRect();
  const w = screenToWorld(e.clientX-rect.left, e.clientY-rect.top);
  ghost.setAttribute("d", `M ${fromX} ${fromY} L ${w.x} ${w.y}`);
}
function removeGhostLine(){ const g = document.getElementById("ghostline"); if(g) g.remove(); }

/* =========================================================================
   11. Canvas interaction — select / drag / pan / zoom / marquee
   ========================================================================= */
function onNodeMouseDown(ev, id){
  if(ev.button !== 0) return;
  ev.stopPropagation();
  const additive = ev.shiftKey || ev.ctrlKey || ev.metaKey;
  if(additive){
    if(state.selection.has(id)) state.selection.delete(id); else state.selection.add(id);
  } else if(!state.selection.has(id)){
    state.selection = new Set([id]);
  }
  state.activeFocusId = id;
  renderNodesSelectionOnly();
  renderProperties();

  const tree = ft();
  const startMouse = { x: ev.clientX, y: ev.clientY };
  const startPositions = new Map();
  for(const sid of state.selection){ const f = focusById(sid); if(f) startPositions.set(sid, {x:f.x, y:f.y}); }
  let moved = false;
  let historySaved = false;
  const gx = state.project.settings.gridX, gy = state.project.settings.gridY;
  function move(e){
    const dx = (e.clientX - startMouse.x) / state.camera.zoom;
    const dy = (e.clientY - startMouse.y) / state.camera.zoom;
    if(!moved && (Math.abs(dx)>2 || Math.abs(dy)>2)){
      moved = true;
      if(!historySaved){ pushHistory(); historySaved = true; } // snapshot BEFORE the coordinates change
    }
    if(!moved) return;
    for(const [sid, start] of startPositions){
      const f = focusById(sid); if(!f) continue;
      // Snap to whole grid slots on every frame, not just on release — HOI4
      // focus coordinates are always integers, and the stored value (not
      // just the rendered position) must reflect that at all times.
      f.x = Math.round(start.x + dx/gx);
      f.y = Math.round(start.y + dy/gy);
      const node = document.querySelector(`.fnode[data-id="${cssEscape(sid)}"]`);
      if(node){ node.style.left = (resolveAbsolutePositions(tree)[sid].x*gx)+"px"; node.style.top = (resolveAbsolutePositions(tree)[sid].y*gy)+"px"; node.classList.add("dragging"); }
    }
    renderConnectionsQuick();
  }
  function up(){
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    if(moved){
      for(const sid of startPositions.keys()){ const f = focusById(sid); if(f){ f.x = Math.round(f.x); f.y = Math.round(f.y); } }
      onProjectChanged("move focus", true);
    }
  }
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
}
function renderConnectionsQuick(){
  const tree = ft(); const pos = resolveAbsolutePositions(tree);
  const gx = state.project.settings.gridX, gy = state.project.settings.gridY;
  const visible = tree.focuses.filter(f => (!state.ui.activeBranchFilter || f.branchId===state.ui.activeBranchFilter) && !state.ui.hiddenBranches.has(f.branchId));
  renderConnections(visible, pos, gx, gy);
}
function renderNodesSelectionOnly(){
  document.querySelectorAll(".fnode").forEach(n=>{
    n.classList.toggle("sel", state.selection.has(n.getAttribute("data-id")));
  });
}
function cssEscape(s){ return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g,"\\$&"); }

function setupCanvasPanZoom(){
  const wrap = document.getElementById("canvaswrap");
  wrap.addEventListener("mousedown", (ev)=>{
    if(ev.button === 1 || (ev.button===0 && ev.spaceHeld) || ev.button===0 && spaceDown){
      startPan(ev); return;
    }
    if(ev.button === 0){
      const rect = wrap.getBoundingClientRect();
      startMarquee(ev.clientX-rect.left, ev.clientY-rect.top, !ev.shiftKey);
    } else if(ev.button===1){ startPan(ev); }
  });
  wrap.addEventListener("dblclick",(ev)=>{
    if(ev.target !== wrap && ev.target.id !== "world" && ev.target.id !== "nodelayer") return;
    const rect = wrap.getBoundingClientRect();
    const world = screenToWorld(ev.clientX-rect.left, ev.clientY-rect.top);
    const gx = state.project.settings.gridX, gy = state.project.settings.gridY;
    commit("add focus", ()=>{
      const branchId = state.ui.activeBranchFilter || ensureDefaultBranch();
      const f = makeFocus({ id: uniqueFocusId("NEW_FOCUS"), x: Math.round(world.x/gx), y: Math.round(world.y/gy), branchId });
      ft().focuses.push(f);
      state.selection = new Set([f.id]); state.activeFocusId = f.id;
    });
  });
  wrap.addEventListener("wheel", (ev)=>{
    ev.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = ev.clientX-rect.left, my = ev.clientY-rect.top;
    const before = screenToWorld(mx,my);
    const factor = ev.deltaY < 0 ? 1.1 : 0.9;
    state.camera.zoom = clamp(state.camera.zoom*factor, 0.12, 2.5);
    const after = screenToWorld(mx,my);
    state.camera.x += (after.x-before.x)*state.camera.zoom;
    state.camera.y += (after.y-before.y)*state.camera.zoom;
    renderCanvasTransform();
  }, {passive:false});
  wrap.addEventListener("contextmenu",(ev)=>{ if(ev.target===wrap || ev.target.id==="world"||ev.target.id==="nodelayer"){ ev.preventDefault(); openCanvasContextMenu(ev); } });
}
let spaceDown = false;
function startPan(ev){
  ev.preventDefault();
  const wrap = document.getElementById("canvaswrap");
  wrap.classList.add("panning");
  const start = { x: ev.clientX, y: ev.clientY, camX: state.camera.x, camY: state.camera.y };
  function move(e){
    state.camera.x = start.camX + (e.clientX-start.x);
    state.camera.y = start.camY + (e.clientY-start.y);
    renderCanvasTransform();
  }
  function up(){ wrap.classList.remove("panning"); window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); }
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
}
function startMarquee(sx, sy, clearFirst){
  const box = document.getElementById("marquee");
  const wrap = document.getElementById("canvaswrap");
  const rect = wrap.getBoundingClientRect();
  box.style.display = "block";
  box.style.left=sx+"px"; box.style.top=sy+"px"; box.style.width="0px"; box.style.height="0px";
  let moved = false;
  function move(e){
    moved = true;
    const cx = e.clientX-rect.left, cy = e.clientY-rect.top;
    const x = Math.min(sx,cx), y = Math.min(sy,cy), w = Math.abs(cx-sx), h = Math.abs(cy-sy);
    box.style.left=x+"px"; box.style.top=y+"px"; box.style.width=w+"px"; box.style.height=h+"px";
  }
  function up(e){
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    box.style.display="none";
    if(!moved){ if(clearFirst){ state.selection=new Set(); state.activeFocusId=null; renderAll(); } return; }
    const cx = e.clientX-rect.left, cy = e.clientY-rect.top;
    const bx1=Math.min(sx,cx), bx2=Math.max(sx,cx), by1=Math.min(sy,cy), by2=Math.max(sy,cy);
    const w1 = screenToWorld(bx1,by1), w2 = screenToWorld(bx2,by2);
    const tree = ft(); const pos = resolveAbsolutePositions(tree);
    const gx = state.project.settings.gridX, gy = state.project.settings.gridY;
    if(clearFirst) state.selection = new Set();
    for(const f of tree.focuses){
      const p = pos[f.id]; const px=p.x*gx, py=p.y*gy;
      if(px+128>=w1.x && px<=w2.x && py+90>=w1.y && py<=w2.y) state.selection.add(f.id);
    }
    state.activeFocusId = [...state.selection][0] || null;
    renderAll();
  }
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
}

function setupKeyboardShortcuts(){
  window.addEventListener("keydown",(ev)=>{
    const tag = (ev.target.tagName||"").toLowerCase();
    const typing = tag==="input"||tag==="textarea"||ev.target.isContentEditable;
    if(ev.code === "Space" && !typing){ spaceDown = true; document.getElementById("canvaswrap").style.cursor="grab"; }
    if(typing) return;
    const mod = ev.ctrlKey || ev.metaKey;
    if(mod && ev.key.toLowerCase()==="z" && !ev.shiftKey){ ev.preventDefault(); undo(); }
    else if(mod && (ev.key.toLowerCase()==="y" || (ev.key.toLowerCase()==="z" && ev.shiftKey))){ ev.preventDefault(); redo(); }
    else if(mod && ev.key.toLowerCase()==="c"){ ev.preventDefault(); clipboard = [...state.selection].map(id=>deepClone(focusById(id))).filter(Boolean); }
    else if(mod && ev.key.toLowerCase()==="v"){ ev.preventDefault(); pasteClipboard(); }
    else if(mod && ev.key.toLowerCase()==="d"){ ev.preventDefault(); duplicateSelection(); }
    else if(mod && ev.key.toLowerCase()==="a"){ ev.preventDefault(); state.selection = new Set(ft().focuses.map(f=>f.id)); renderAll(); }
    else if(ev.key === "Delete" || ev.key === "Backspace"){ if(state.selection.size){ ev.preventDefault(); deleteSelection(); } }
    else if(ev.key === "Escape"){ state.selection = new Set(); state.activeFocusId=null; renderAll(); }
  });
  window.addEventListener("keyup",(ev)=>{ if(ev.code==="Space"){ spaceDown=false; document.getElementById("canvaswrap").style.cursor=""; } });
}
let clipboard = [];
function pasteClipboard(){
  if(!clipboard.length) return;
  commit("paste", ()=>{
    const idMap = {}; const tree = ft(); const clones = [];
    for(const src of clipboard){
      const clone = deepClone(src);
      clone.id = uniqueFocusId(src.id + "_PASTE");
      idMap[src.id] = clone.id;
      clones.push(clone);
    }
    for(const c of clones){
      c.x += 1; c.y += 1;
      c.prerequisites = c.prerequisites.map(g=>g.map(pid=>idMap[pid]||pid).filter(pid=>focusById(pid)||idMap[pid]));
      tree.focuses.push(c);
    }
    state.selection = new Set(clones.map(c=>c.id));
    state.activeFocusId = clones[0] && clones[0].id;
  });
}

/* -------- context menus -------- */
function showContextMenu(x, y, items){
  closeContextMenu();
  const menu = el("div", {class:"context-menu", style:`left:${x}px; top:${y}px;`});
  for(const it of items){
    if(it.sep){ menu.appendChild(el("div",{class:"cm-sep"})); continue; }
    menu.appendChild(el("div", {class:"cm-item"+(it.danger?" danger":""), onclick:()=>{ closeContextMenu(); it.action(); }}, it.label));
  }
  document.body.appendChild(menu);
  const rect = menu.getBoundingClientRect();
  if(rect.right > window.innerWidth) menu.style.left = (x-rect.width)+"px";
  if(rect.bottom > window.innerHeight) menu.style.top = (y-rect.height)+"px";
  setTimeout(()=> window.addEventListener("mousedown", closeContextMenu, {once:true}), 0);
}
function closeContextMenu(){ document.querySelectorAll(".context-menu").forEach(m=>m.remove()); }
function openNodeContextMenu(ev, id){
  const f = focusById(id);
  showContextMenu(ev.clientX, ev.clientY, [
    { label:"プロパティを表示", action:()=>{ state.activeFocusId=id; renderAll(); } },

    { sep:true },
    { label:"相互排他に設定…", action:()=> openMutexPicker(id) },
    { sep:true },
    { label:"削除", danger:true, action: deleteSelection },
  ]);
}
function openCanvasContextMenu(ev){

      commit("add focus", ()=>{

        const f = makeFocus({ id: uniqueFocusId("NEW_FOCUS"), x:Math.round(world.x/gx), y:Math.round(world.y/gy), branchId });
        ft().focuses.push(f); state.selection=new Set([f.id]); state.activeFocusId=f.id;
      });
    }},
    { label:"貼り付け", action: pasteClipboard },
    { sep:true },
    { label:"全体表示に合わせる", action: fitToScreen },
    { label:"自動整列", action:()=>{ if(confirm("現在の配置を自動整列で上書きします。よろしいですか？")) commit("auto layout", autoLayout); } },
  ]);

function openMutexPicker(id){
  openModal("相互排他グループに設定", (body, close)=>{
    const tree = ft();
    const others = tree.focuses.filter(f=>f.id!==id);
    const sel = el("select", {multiple:true, size:Math.min(10, Math.max(4,others.length)), style:"width:100%;"});
    for(const o of others) sel.appendChild(el("option",{value:o.id, selected: mutexPartnersOf(id).includes(o.id)}, o.id));
    body.appendChild(el("p",{style:"color:var(--ink-faint);font-size:11.5px;margin:0 0 10px;"}, "Ctrl/Cmdクリックで複数選択できます。選択したNFすべてと相互排他になります。"));
    body.appendChild(sel);
    return { onSave: ()=>{
      const chosen = [...sel.selectedOptions].map(o=>o.value);
      commit("set mutex", ()=>{
        const tree = ft();
        tree.mutexGroups = tree.mutexGroups.map(g=>({...g, focuses: g.focuses.filter(x=>x!==id)})).filter(g=>g.focuses.length>1);
        if(chosen.length) tree.mutexGroups.push({ id: uid("mutex"), focuses:[id, ...chosen] });
      });
      close();
    }};
  });
}

function fieldWrap(label, inputEl){
  return el("div", {class:"field"}, [ el("label",null,label), inputEl ]);
}
function propInput(f, key, type, opts){
  opts = opts || {};
  const attrs = { type: type||"text", value: f[key] };
  if(opts.integer) attrs.step = "1";
  const input = el("input", attrs);
  input.addEventListener("change", ()=>{
    let v = input.value;
    if(type==="number") v = opts.integer ? Math.round(parseFloat(v)||0) : (parseFloat(v)||0);
    if(key==="id"){
      const newId = renameFocusId(f.id, v);
      if(newId===null){ alert("そのIDは既に使用されています。"); input.value = f.id; return; }
      pushHistory(); onProjectChanged("rename id", true);
      return;
    }
    commit("edit "+key, ()=>{ f[key] = v; input.value = f[key]; });
  });
  return input;
}

    body.appendChild(search);

    function draw(){
      clear(grid);
      const qv = search.value.trim().toLowerCase();
      const all = [
        ...BUILTIN_ICONS.map(gfx=>({gfx, dataUrl:null})),
        ...state.project.assets.icons.map(a=>({gfx:a.gfxName, dataUrl:a.dataUrl})),
      ].filter(x=>!qv || x.gfx.toLowerCase().includes(qv));
      for(const item of all){
        const tile = el("div",{class:"asset-tile"+(f.icon===item.gfx?" sel":"")});
        if(item.dataUrl) tile.appendChild(el("img",{src:item.dataUrl}));
        else tile.appendChild(el("div",{style:"height:32px;display:flex;align-items:center;justify-content:center;"}, el("span",{class:"ph"},"GFX")));
        tile.appendChild(el("div",{class:"an"}, item.gfx.replace(/^GFX_/,"")));
        tile.onclick = ()=>{ commit("set icon", ()=>{ f.icon = item.gfx; }); close(); };

function importYmlFiles(files, reportBox, forceLangKey, onDone){
  let pending = files.length;
  const allStats = [];
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      let stats = null, error = null;
      try{
        const parsedByLang = parseLocalisationText(String(reader.result), forceLangKey || null);
        if(!Object.keys(parsedByLang).length){
          error = forceLangKey
            ? "有効な \"KEY:0 \\\"値\\\"\" 形式の行が見つかりませんでした。"
            : "l_<言語>: ブロックが見つかりませんでした（自動認識できません）。「このファイルを扱う言語」で言語を指定してください。";
        } else {
          commit("import yml: "+file.name, ()=>{ stats = mergeLocalisationImport(parsedByLang); });
        }
      }catch(e){ error = e.message; }
      allStats.push({ name:file.name, stats, error });
      pending--;
      if(pending===0){ renderYmlImportReport(reportBox, allStats); if(onDone) onDone(); }
    };
    reader.onerror = ()=>{ allStats.push({name:file.name, error:"ファイルの読み込みに失敗しました。"}); pending--; if(pending===0){ renderYmlImportReport(reportBox, allStats); if(onDone) onDone(); } };
    reader.readAsText(file, "utf-8");
  });
}
function renderYmlImportReport(box, allStats){
  clear(box);
  box.appendChild(el("h5",{style:"margin:0 0 6px;font-size:10px;color:var(--ink-faint);letter-spacing:.06em;font-family:var(--font-head);"}, "読み込み結果"));
  for(const s of allStats){
    const wrap = el("div",{style:"background:var(--bg-alt);border:1px solid var(--line);border-radius:4px;padding:8px 9px;margin-bottom:6px;font-size:11px;"});
    wrap.appendChild(el("div",{style:"font-family:var(--font-mono);color:var(--brass-bright);margin-bottom:3px;"}, s.name));
    if(s.error){ wrap.appendChild(el("div",{style:"color:var(--red-bright);"}, "✕ " + s.error)); box.appendChild(wrap); continue; }
    for(const langKey in s.stats.languages){
      const ls = s.stats.languages[langKey];
      wrap.appendChild(el("div",{style:"color:var(--ink-dim);"}, `${labelForLangKey(langKey)}（${langKey}）: ${ls.keys} キー中 NF一致 ${ls.matched} 件／未対応 ${ls.unmatched} 件`));
    }
    box.appendChild(wrap);
  }
  const totalUnmatched = allStats.reduce((n,s)=> n + (s.stats ? s.stats.unmatchedKeys : 0), 0);
  if(totalUnmatched>0){
    box.appendChild(el("p",{style:"font-size:10.5px;color:var(--ink-faint);margin-top:4px;line-height:1.6;"},
      `※ ${totalUnmatched} 件のキーは現在のNFツリーに存在するIDと一致しませんでした。破棄はされていません（ロケール内部データとして保持されます）が、プレビューには使用されません。`));
  }
  renderAll();
}

function importCodeIntoProject(text, keepLocAndAssets){
  const res = parseFocusTreeText(text);
  if(!res.ok){ alert("インポートに失敗しました: " + res.error); return; }
  commit("import code", ()=>{
    const oldLoc = keepLocAndAssets ? deepClone(state.project.localisation) : null;
    state.project.focusTree = res.tree;
    if(keepLocAndAssets && oldLoc){
      // keep existing localisation entries for ids that still exist; new ids get blank entries
      const kept = {};
      for(const f of res.tree.focuses) if(oldLoc.entries[f.id]) kept[f.id] = oldLoc.entries[f.id];
      state.project.localisation.entries = kept;
    } else {
      state.project.localisation.entries = {};
    }
    for(const f of res.tree.focuses) if(!state.project.localisation.entries[f.id]) state.project.localisation.entries[f.id] = {};
    state.selection = new Set(); state.activeFocusId = null;
  });
  state.ui.codeDirty = false;
  if(res.warnings.length){
    showImportWarnings(res.warnings);
  } else {
    setStatus(`インポート完了：NF ${res.tree.focuses.length} 件を読み込みました。`);
  }
  fitToScreen();
}
